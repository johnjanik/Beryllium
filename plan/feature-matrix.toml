# S: security

[[feature]]
id = "S-REN-01"
group = "Capsicum renderer sandbox"
title = "Renderers in capability mode"
need = "Every production renderer enters Capsicum capability mode before it handles web content, and the browser checks it with the kernel."
priority = "must"
phase = 2
implemented = "partial"
built = "no"
tested = "manual"
where = ["patches/security/beryllium-capsicum-renderer.patch",
         "patches/security/beryllium-renderer-tracing-after-lockdown.patch",
         "patches/platform/beryllium-bsd-kernel-thread-names.patch"]
tests = ["freebsd/tests/browser/tests/test_50_sandbox.py::test_capability_mode_per_process",
         "freebsd/tests/browser/tests/test_50_sandbox.py::test_threads_at_the_lockdown_point",
         "freebsd/tools/tests/test_sandbox_gate.py",
         "freebsd/tools/tests/test_thread_dump.py"]
evidence = "owner, 0.20.3.3 with --enable-features=BerylliumCapsicumRenderer, 4 Nov 2026: every renderer in capability mode (procstat), the whole suite passes; trap mode stops renderers at their first refused call (cpuset_getaffinity); owner, 0.20.3.4, 5 Nov 2026: the same, and no inherited directory or profile file left; owner, 0.20.3.6, 5 Nov 2026: every renderer in capability mode, the suite passes apart from the descriptor test (one unnamed file per renderer); owner, 0.20.3.7, 5 Nov 2026: every renderer in capability mode and the whole suite passes; owner, 0.20.3.8, 7 Nov 2026: the same with per-descriptor rights, but renderers spun on a kqueue poll (fixed for 0.20.3.9); owner, 0.20.3.10, 7 Nov 2026: every renderer the browser listed in capability mode, idle CPU 0.00 s; the gate caught one renderer the browser had just launched and not yet at its lockdown point, so the tests now give a listed renderer five seconds to get there; owner, 0.20.3.11, 8 Nov 2026: every listed renderer in capability mode, the lockdown log clean, the gate passing apart from the policy test (two renderer-made sockets, S-REN-05); owner, 0.20.3.12, 8 Nov 2026: every listed renderer in capability mode, the lockdown log clean, the two socket pairs cut at creation (made on CrRendererMain and Compositor); descriptors unreadable in that run (unprivileged_proc_debug=0), so the gate failed the descriptor tests as designed; the same day with the sysctl at 1: every readable renderer within the policy; owner, 0.20.3.13, 9 Nov 2026: every listed renderer in capability mode, the lockdown log clean, the policy held on all four renderers read, the browser's sender-side cuts counted per renderer (1 to 88); threads=-1 in every lockdown report (the kernel query failed; read another way and logged from 0.20.3.14); owner, 0.20.3.14, 10 Nov 2026: every listed renderer in capability mode, the policy held, the browser cut 1 to 93 descriptors per renderer; threads=-1 still, by the second query (the error is logged; the next report shows it); owner, 0.20.3.15, 10 Nov 2026: every listed renderer in capability mode, the policy held, the thread count reads at last and says 2 in every renderer: one thread besides CrRendererMain at the lockdown point, to be named by 0.20.3.16; owner, 0.20.3.16, 10 Nov 2026, two lockdown runs: every listed renderer in capability mode, the policy held on every descriptor, the browser cut 1 to 90 descriptors per renderer, the whole suite as without the lockdown; threads=2 again and thread_names=beryllium,beryllium, which says nothing, because the FreeBSD port never gives the kernel a thread's name; from the source the second thread is Chromium's tracing thread (PerfettoTrace), whose deferral the port put in RunZygote(), a path FreeBSD never runs; two patches for 0.20.3.17 (the renderer starts tracing after the lockdown; thread names reach the kernel), neither compiled, and a suite test that lists the threads at the lockdown point from their stacks with lldb, awaiting its first FreeBSD run; owner, 0.20.3.17 (released 10 Nov 2026), the sandbox group with the lockdown, one run: all eight tests pass, the gate for the first time since it began counting threads; four lockdown reports with threads=1, the kernel naming the thread CrRendererMain; lldb finds one thread when RendererMain begins and one at the lockdown (stopped at the utrace marker under EnableSandbox), so the second thread of 0.20.3.15 and 0.20.3.16 was the tracing thread; owner, 0.20.3.17, 11 Nov 2026, the whole suite with the lockdown: passes, the gate for the second time (threads=1 and CrRendererMain in four renderers, one thread under lldb at both moments), and the whole suite passes without the lockdown as well; owner, 0.20.3.18 (0.20.3.17 with two canvas noise patches), 12 Nov 2026: the whole suite passes without the lockdown (35 pass, 4 skipped for want of their switches) and with it (36 pass, 3 skipped), the gate for the third time: four renderers in capability mode, four lockdown reports with threads=1 and CrRendererMain, 20 to 37 descriptors per renderer and none outside the policy, the browser cutting 1 to 81 per renderer, 14 limited socket pairs from the same two places as on 0.20.3.17, one thread under lldb at both moments; the lockdown run shared the machine with two other suite runs; two more whole-suite lockdown runs at 08:26, at the same time as each other and as a survey, pass as well. Correction, 12 Nov 2026: from 0.20.3.13 to 0.20.3.18 the gate's check of the lockdown's log read its last 200 lines only (the lines it accounts for add up to exactly 200 in every lockdown report since 0.20.3.13), so the report counts, thread counts, socket pairs and cut counts given above for those builds are those of the end of the log, three or four of about eight lockdown reports a run, and a refusal written earlier would not have failed the gate; the kernel's answer per renderer, the descriptor policy and the lldb probe do not use the log. The suite reads the whole log from 12 Nov 2026 (freebsd/tools/tests/test_sandbox_gate.py::test_gate_reads_the_whole_log_not_its_end). owner, 0.20.3.18, 12 Nov 2026 08:56, the first run with the whole log read, alone on the machine: the whole suite passes with the lockdown (36 pass, 3 skipped); 340 lines of the lockdown's log read, all of it; eight lockdown reports for eight renderers, each threads=1 and CrRendererMain; no received descriptor outside the policy, none refused before sending, no failure; the browser cutting 10 to 121 descriptors per renderer, 304 in all; 14 socket pairs made by the renderers, each limited (the note said 28, counting each first pair's stack line as a pair; corrected); four renderers in capability mode by the kernel, 20 to 36 descriptors each and none outside the policy; one thread under lldb at both moments; owner, 0.20.3.19 (the code of 0.20.3.18 built again), 12 Nov 2026, one lockdown run, alone on the machine: the gate passes with the whole log read, 310 lines and each accounted for: eight lockdown reports with threads=1 and CrRendererMain, 14 socket pairs each limited (8 on the main thread, 6 on the compositor thread) with their 14 stack lines, 274 lines of the browser cutting what it sent, nothing refused on arrival, no failure; four renderers in capability mode by the kernel; one thread under lldb at both moments"
source = ["helium-freebsd-security-port-spec.md §6.1", "plan/06-SECURITY-MODEL.md §3.1", "RT-04"]
notes = "Opt-in. Not yet a sandbox: in 0.20.3.3 renderers inherited directories (/, /usr...) and writable profile files, gone in 0.20.3.4 (S-IPC-01); they still hold shared memory as writable unlinked files in /tmp, replaced by sealed memfds with limited rights in 0.20.3.5 (S-SHM-01, S-SHM-02); 0.20.3.7 hands renderers no swap file, so they hold no writable file. Still missing: the allowlist, least rights on every descriptor, the kernel check, default on. From 7 Nov 2026 the sandbox tests are a gate when the lockdown is requested: a renderer not in capability mode, or unreadable, fails them instead of being skipped (plan/16 BER-04). From 0.20.3.13 the lockdown logs the thread count at its point (RendererMain locks down before RenderThreadImpl exists) and the gate requires 1. The threads=-1 of 0.20.3.13 and 0.20.3.14 was the lockdown discarding the count it had read (the sweep's result replaced the whole Confinement); kept from 0.20.3.15."

