# Beryllium feature matrix: the source of plan/13-FEATURE-MATRIX.md.
# Edit this file, then run freebsd/tools/feature-matrix; CI runs --check.
# Field rules: freebsd/tools/feature-matrix --help. Areas by id letter:
# F functionality, P privacy, S security, B build/packaging/install,
# R testing/release/maintenance. Rows appear in this file's order.

[meta]
as_of = "2026-11-04"
release = "v0.20.3.1-1"
next_phase = 2

[meta.intro]
F = "What a user does with the browser on FreeBSD. Evidence \"owner, 0.20.3.1\" means the maintainer's machine: FreeBSD 16.0-CURRENT, NVIDIA GeForce RTX 5090 Laptop (driver 595.99.02), KDE Plasma on Wayland. \"15.1 package\" runs were made on the same machine on 3 November 2026, before the release; the browser suite has not yet been rerun in full on the release."
P = "What Beryllium promises about the network and the user's data, and the privacy features it inherits from Helium and ungoogled-chromium."
S = "The sandbox and hardening work, Beryllium's reason to exist. Nothing in this area confines a process yet: the release ships with no sandbox, and says so."
B = "Building the port, the package, and installing, updating and removing it."
R = "Test infrastructure, CI, releases, keeping up with Helium, Chromium and FreeBSD, and documentation."

