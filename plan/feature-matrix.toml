[[feature]]
id = "F-GPU-01"
group = "Graphics"
title = "GPU acceleration and WebGL"
need = "Compositing, rasterisation and WebGL are hardware accelerated where the driver allows."
priority = "should"
phase = 1
implemented = "inherited"
built = "v0.20.3.1-1"
tested = "passing"
tests = ["freebsd/tests/browser/tests/test_40_rendering.py::test_webgl_webgpu_canvas",
         "freebsd/tests/browser/tests/test_40_rendering.py::test_gpu_info"]
evidence = "owner, 0.20.3.1 on NVIDIA, suite run 4 Nov 2026; Intel and AMD untested; owner, 0.20.3.10, 7 Nov 2026: passing without the lockdown; with it the default canvas read back 18,52,87 for #123456 (86 expected, as in 0.20.3.8 with the lockdown), WebGL fine; owner, 0.20.3.11, 8 Nov 2026: three rendering runs (lockdown off, on, 2D canvas forced to software) all read 86 on the default and on a CPU canvas, so the 87 looked like a one-off GPU readback; owner, 0.20.3.12, 8 Nov 2026, lockdown on: both the default and the CPU canvas read 18,53,86, so it is not the GPU and happens only under the lockdown (2 of 5 lockdown runs, 0 of 7 default runs); the test is exact on both canvases again and records a colour sweep (plan/14 increment 4); the same day, lockdown on, both canvases read 18,52,87 again: three of six lockdown runs off by one, zero of eight default runs; owner, 0.20.3.13, 9 Nov 2026: the grey sweep found one in four sampled greys one level off in one channel on the CPU canvas, with and without the lockdown (+1 throughout one run, -1 throughout the other, channel varying); #123456 and the default canvas exact in both; WebGL fine, WebGPU no adapter; 9 Nov 2026, six more 0.20.3.13 runs: the moved greys of each run share one residue modulo 4 with a per-run seed, which is Helium's canvas fingerprinting noise (P-FPR-04), not a rendering fault; the rendering test now runs with the noise off and awaits its first run; owner, 0.20.3.14, 10 Nov 2026, six runs with the noise off: every sweep exact on both canvases, by fill and by putImageData, WebGL fine; owner, 0.20.3.16, 10 Nov 2026, the first runs with the Intel GPU driver loaded beside NVIDIA's (Intel on the laptop panel, NVIDIA on the external display): with --render-node-override=/dev/dri/renderD128 the GPU process renders on NVIDIA and the rendering and media groups pass; with renderD129 it reports ANGLE on Mesa 26.2.2, Intel Graphics (ARL), and the browser process ends about a second after every start (21 errors and 2 failures of 38 tests, all a closed DevTools connection), cause unknown: the suite did not say how the process ended and does from this date; a second pair of runs the same day gave the same two results; from Chromium's source, the browser renders on the compositor's main device unless the switch names another, and ends on any Wayland error, so a compositor that cannot show the other GPU's buffers is a candidate cause, unconfirmed until the log of such a run or a start without the switch is seen; confirmed the same evening from that run's log and the kernel's: Mesa's Intel driver declined every buffer layout the compositor offered (Unsupported modifier, three times), the compositor refused the buffer sent instead (libwayland error 7, importing the supplied dmabufs failed), and each browser exited on signal 5, Chromium's stop on a Wayland error; the pairing is unsupported by the desktop, not a fault in the browser, and the documentation of the switch says what it requires; two lockdown runs the same evening without the switch: the browser chose renderD128 by itself and rendered on the NVIDIA GPU, everything in the rendering and media groups passing; owner, 0.20.3.17, 11 Nov 2026, two full runs on the NVIDIA GPU (the browser's own choice of renderD128): rendering and media pass with the lockdown off and on; both displays now report HDR (PQ transfer, 10 bits per component) and the canvas sweeps are still exact; owner, 0.20.3.18, 12 Nov 2026: passes in all seven suite runs of the day; owner, 0.20.3.19 (the code of 0.20.3.18 built again), 12 Nov 2026: passes in both suite runs, one without and one with the lockdown"
source = ["plan/01-PROJECT-CHARTER.md D6", "plan/08-TESTING-AND-VERIFICATION.md §2.4"]

[[feature]]
id = "F-GPU-02"
group = "Graphics"
title = "WebGPU"
need = "WebGPU finds an adapter, or is turned off deliberately and documented."
priority = "later"
phase = 3
implemented = "partial"
built = "v0.20.3.1-1"
tested = "failing"
where = ["freebsd/ports/www/beryllium/Makefile"]
tests = ["freebsd/tests/browser/tests/test_40_rendering.py::test_webgl_webgpu_canvas"]
evidence = "owner, 0.20.3.1, 4 Nov 2026: WebGPU enabled in the feature list but no adapter (the test records it, asserts nothing); owner, 0.20.3.18, 12 Nov 2026, seven runs: the same, webgpu=enabled in the feature list and no adapter; owner, 0.20.3.19, 12 Nov 2026, two runs: the same"
notes = "Read from the source on 11 Nov 2026: on Linux and BSD, WebGPUDecoderImpl::CreatePreferredAdapter asks for a Vulkan adapter only when the GPU process composites with Vulkan or WebGPU-on-Vulkan beside GL is enabled, and otherwise for the null backend; the reports show vulkan=disabled_off and webgpu_on_vk_via_gl_interop=disabled_off. plan/18 section 7 recommends turning WebGPU off deliberately until the GPU process has a policy, with the probes that say whether an adapter is obtainable at all."
source = ["plan/12-WORK-PLAN-AND-RED-TEAM.md §11", "RT-07", "plan/18-REMAINING-WORK.md §7"]

