puset_getaffinity (the 242 were the receive path's own getsockname/getpeername, gone); owner, 0.20.3.15, 10 Nov 2026, lockdown on: every renderer read within the policy, the survey's after-lockdown list cpuset_getaffinity alone, and the return addresses named both socket-pair callers (Mojo's BaseSharedMemoryService client on the main thread, Mojo's ThreadLocalNode transport on the compositor thread), both cut at creation; owner, 0.20.3.16 and 0.20.3.17 (released), 10 Nov 2026, lockdown on: every renderer read within the policy's rights again, the browser cutting 1 to 90 and 1 to 71 descriptors per renderer before sending; the ioctl and fcntl allowlists of the need are not tested by this row's test; 0.20.3.17, 11 Nov 2026, second lockdown run: within the policy again, the browser cutting 1 to 83 descriptors per renderer; owner, 0.20.3.18, 12 Nov 2026: passes in the four runs with the lockdown, the ones that include it; owner, 0.20.3.19 (the code of 0.20.3.18 built again), 12 Nov 2026: passes in the run with the lockdown (20, 36, 34 and 26 descriptors, none outside; the browser cutting 6 to 119 descriptors per renderer)"
source = ["helium-freebsd-security-port-spec.md §6.1", "plan/06-SECURITY-MODEL.md §3.2"]
notes = "0.20.3.5: shared memory descriptors are created with limited rights (S-SHM-02). 0.20.3.8: at lockdown every descriptor is cut to its type's rights, fcntls to F_GETFL/F_SETFL as needed, ioctls to none; the suite checks procstat -C against the same policy. 0.20.3.8 withheld CAP_EVENT from kqueues and every renderer spun in epoll-shim's poll-before-kevent loop (6 million refusals in the survey); from 0.20.3.9 kqueues keep event and fstat, eventfds and pipes the ioctl FIONREAD, and a stability test checks idle CPU. From 0.20.3.9 the message pump cuts its kqueue and eventfd at creation and a confined process cuts what it receives over Mojo (defence in depth; the browser limiting what it sends, S-IPC-01, is the boundary and comes next). From 0.20.3.14 the receive path asks a socket's names only with the rights to ask (a socket cut by its sender has neither), and logs one stack trace per socket-pair site and thread to name the caller. 0.20.3.14's stack traces for the socket pairs were empty (no unwind tables in the official build); from 0.20.3.15 the return addresses are logged from the frame pointers as module+offset and the suite names them with llvm-symbolizer."

