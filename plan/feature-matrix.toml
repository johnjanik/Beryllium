[[feature]]
id = "P-FPR-04"
group = "Fingerprinting"
title = "Fingerprinting noise"
need = "Canvas, WebAudio and hardwareConcurrency carry per-site noise by default, with a setting and per-site exceptions."
priority = "must"
phase = 1
implemented = "inherited"
built = "v0.20.3.1-1"
tested = "passing"
where = ["helium/patches/helium/core/noise/core.patch", "helium/patches/helium/core/noise/canvas.patch",
         "patches/privacy/beryllium-noise-hash-whole-token.patch",
         "patches/privacy/beryllium-noise-snapshot-channel-order.patch",
         "freebsd/privacy/noise-hash/README.md", "freebsd/privacy/noise-hash/model.py",
         "freebsd/privacy/noise-hash/probe.html", "freebsd/privacy/noise-hash/battery",
         "freebsd/privacy/noise-hash/battery.html", "freebsd/privacy/noise-hash/battery.js"]
tests = ["freebsd/tests/browser/tests/test_60_privacy.py::CanvasNoise",
         "freebsd/tools/tests/test_noise_hash_evidence.py",
         "freebsd/tools/tests/test_noise_battery.py"]
source = ["README.md"]
evidence = "owner, 0.20.3.8 to 0.20.3.13, 7 to 9 Nov 2026: canvas readbacks of a flat fill carried one-level noise in one RGB channel on a quarter of the values, with a seed that changed per browser session (seen by the rendering test as a colour off by one and identified on 9 Nov 2026); WebAudio, hardwareConcurrency, the setting and per-site exceptions unobserved; owner, 0.20.3.14, 10 Nov 2026, four runs: 24 per cent of a flat fill's pixels moved by one level in one channel, the same on a second read, none with the feature off; the second origin moved other pixels in three runs and, in one, exactly the first origin's on its first load; owner, 0.20.3.15, 10 Nov 2026, two runs: all three canvas noise tests pass, the second origin moving other pixels on its first load; owner, 0.20.3.16, 10 Nov 2026, on the NVIDIA render node: both origins moved the same 982 pixels, after a reload as well, and the cause was found the same day: the noise hash hands out its low bits and an FNV step leaves the low two bits depending on the low two bits of the token, so a flat fill moves one of four pixel sets (1031, 998, 1085 or 982 pixels of 4096, the only counts any report has shown), the same four in every browser with this code, and two sites share a set in one session of four (two of the seven runs that compared two origins); a model of the hash reproduces the 982 pixels the report lists exactly; patches/privacy/beryllium-noise-hash-whole-token.patch finalizes the hash before each draw, for build 0.20.3.17, compiled alone but not yet in the tree, so the row reads failing until that build passes the two tests; a second run on the NVIDIA node the same day: both origins moved 1031 pixels, the fourth set, which the model had given before any report showed it, and exactly the model's set for token low bits 0 (three of eight comparisons with a shared set); a lockdown run with the new suite the same evening: both origins moved set 1 (998 pixels), and test_moved_pixels_depend_on_the_whole_token named it, as it will on every build before 0.20.3.17 (four of nine comparisons); 0.20.3.17 (released 10 Nov 2026) is built with the patch, which therefore compiles in the tree; the privacy group has not been reported on that build, so the row reads written, not passing; owner, 0.20.3.17, 11 Nov 2026, two full runs (lockdown off and on): all four canvas noise tests pass; 1016 and 994 pixels moved on the two origins in one session, 1022 and 1000 in the other, other pixels each time and none of the four sets of the old hash; the same on a second read; none with the feature off. WebAudio and hardwareConcurrency noise still have no test"
notes = "Canvas: helium/patches/helium/core/noise/canvas.patch, feature HeliumNoiseCanvas under HeliumNoise, both on by default, flag helium-noise-canvas; on getImageData, toDataURL and toBlob a pixel in a smooth neighbourhood has one RGB channel moved by one level when a hash of the per-session per-origin token, its coordinates and its value selects it (one in four); the channel and direction come from the content hash. test_60_privacy CanvasNoise (written 9 Nov 2026) checks presence, shape, stability within a session, difference between 127.0.0.1 and localhost, and absence with --disable-features=HeliumNoiseCanvas; the rendering group runs with that switch. From 10 Nov 2026 the class also checks that the moved pixels are none of the four sets of the hash before 0.20.3.17 (berytest/noise.py models it; freebsd/tools/tests/test_noise_model.py), and the per-site test no longer reloads: the first-load explanation of the 0.20.3.14 result was wrong. The audio and hardware-concurrency noise use the same hash class and get the same change; neither has a test yet. Measured on Helium 0.21.2.1 itself by the owner on 11 Nov 2026 (macOS arm64 and Fedora x86_64, two runs each, the battery in freebsd/privacy/noise-hash): the four sets in 120 readbacks of 120, the same on both machines, and in textured areas five bits of the token account for the sign of every step. The same runs showed that a canvas snapshot (toDataURL, toBlob, convertToBlob) is noised with red and blue exchanged, so one site can read two different noisings of one canvas; Beryllium inherits that. patches/privacy/beryllium-noise-snapshot-channel-order.patch, written 11 Nov 2026 and first built in 0.20.3.18 (released 12 Nov 2026), reads such a snapshot back in ImageData's order first. What the noise does not cover at all is P-FPR-07. owner, Beryllium 0.20.3.17 on FreeBSD, 11 Nov 2026, the battery: the change to the hash confirmed by a test not written for it, 30 readbacks with 30 different sets of pixels and none of the four, counts 945 to 1065, no value of five bits explaining the textured image, no two sites of 75 pairs with the same pixels; snapshots noised with red and blue exchanged in 30 of 30, as on Helium. owner, Beryllium 0.20.3.18 on FreeBSD, 12 Nov 2026, the battery, two runs of 30 readbacks with a restart between: toDataURL, toBlob and convertToBlob gave the pixels of getImageData in 60 of 60, for the grey fill, the textured image and the mixed one, so a canvas has one noise whichever call reads it; the hash change held in a second build (60 different sets, none of the four, counts 952 to 1071, no value of five bits, no two sites of 150 pairs alike); control with the noise off exact in 12 of 12. owner, 0.20.3.18, 12 Nov 2026, four suite runs (plain, network, diagnostics, lockdown): all four canvas noise tests pass in each; 1012 and 1016 pixels moved on the two origins, 994 and 1030, 1006 and 1056, 1049 and 1029, other pixels each time, none of the four sets."

