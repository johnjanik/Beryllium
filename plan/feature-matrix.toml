[[feature]]
id = "S-IPC-01"
group = "Launcher and IPC"
title = "Clean descriptors at launch"
need = "The launcher limits the rights of descriptors it passes, and every child closes all others with closefrom before it runs."
priority = "must"
phase = 2
implemented = "partial"
built = "no"
tested = "passing"
where = ["patches/security/beryllium-close-inherited-descriptors.patch", "patches/security/beryllium-sender-side-rights.patch", "patches/security/beryllium-descriptor-rights.patch"]
tests = ["freebsd/tests/browser/tests/test_50_sandbox.py::test_renderers_hold_no_directories_or_writable_files",
         "freebsd/tests/browser/tests/test_50_sandbox.py::test_lockdown_log"]
evidence = "owner, 0.20.3.4, 5 Nov 2026: the survey lists about 30 descriptors in a renderer instead of about 120, no directory or profile file, with or without the lockdown (the descriptor test still failed on shared memory, S-SHM-01); owner, 0.20.3.7, 5 Nov 2026: the descriptor test passes with and without the lockdown; owner, 0.20.3.13, 9 Nov 2026, lockdown on: the browser cut 1 to 88 descriptors per renderer before sending (VLOG cut lines), none refused outright, every renderer read within the policy; owner, 0.20.3.18, 12 Nov 2026: passes in all seven suite runs of the day; owner, 0.20.3.19 (the code of 0.20.3.18 built again), 12 Nov 2026: passes in both suite runs, one without and one with the lockdown"
source = ["plan/06-SECURITY-MODEL.md §4", "plan/03-ARCHITECTURE.md §4.2"]
notes = "On FreeBSD /dev/fd lists only 0-2 without fdescfs, so children inherited everything the browser had open: the 0.20.3.3 survey found ~120 descriptors in a renderer, including /, /usr, /usr/local and writable profile databases. Fixed in 0.20.3.4 with close() and closefrom(2) between fork and exec. Rights limits on what the launcher passes: only shared memory so far (S-SHM-02, 0.20.3.5); from 0.20.3.9 the receiving renderer cuts the rest itself (beryllium-descriptor-rights.patch), which is not a boundary; from 0.20.3.13 the browser cuts every descriptor it sends a renderer launched with the lockdown on, before sendmsg (beryllium-sender-side-rights.patch: the launcher registers the pid as a confined peer, Mojo's transport cuts by kind; a writable File System Access handle keeps a writable kind). Still receiver-limited only: what other children send a renderer over the transports the browser introduced between them (in the survey of 10 Nov 2026 one renderer held direct sockets to the GPU process, the network service and the storage service); and the sender alone is not yet verified with the receiver's limit off. Design, tests and red-team plan: plan/18 section 1."

