[[feature]]
id = "F-MED-04"
group = "Media"
title = "Live YouTube playback"
need = "A YouTube video plays for 60 s without a crash or player error."
priority = "should"
phase = 1
implemented = "inherited"
built = "v0.20.3.1-1"
tested = "manual"
tests = ["freebsd/tests/browser/tests/test_80_youtube.py::test_watch_video"]
evidence = "owner, 0.20.3.1, 4 Nov 2026, by hand; owner, 0.20.3.17, 11 Nov 2026, the suite's first run with the network since 3 Nov: the player showed 'Something went wrong. Refresh or try again later.' through 58 s, the video element at time 0 with no data (readyState 0) and no media error, AV1 480p and Opus chosen; everything else in that run passed, local playback of every codec included. Cause unknown: the suite's profile is new and driven over DevTools; the bundled uBlock Origin's lists are as old as the build, its updates going through the online services, which are off; or the build. The test recorded nothing that tells these apart and from this date reports YouTube's playability status, the player's error fields, failed requests and error responses by host, and console errors, and skips when YouTube itself refuses the session (tried from a data centre address, where YouTube answered LOGIN_REQUIRED). Not yet checked: the same video by hand in 0.20.3.17; owner, 0.20.3.17, 11 Nov 2026: the video plays in his ordinary session; a second suite run with the new diagnostics: YouTube's answer for the video is OK, the video plays about 44 s (pt.44 in the player's error, the owner sees it stop at 46 s), then the player reports ump.spsrejectfailure (HTML5_SPS_UMP_STATUS_REJECTED): YouTube's streaming server rejecting a session it would not attest, a new profile driven over DevTools; 18 requests blocked by the content blocker (to www.youtube.com, googlevideo.com and google hosts), as in any session. So the failure was the automated session's, not the browser's, the build's or the filter lists'. The test now judges playback up to such a rejection (enough of it passes with a note, too little skips), opens the page without the Runtime domain, and still fails on any other player error, a media error or a crash; owner, 0.20.3.18, 12 Nov 2026, that version's first run on FreeBSD: the test passes with its note, AV1 480p and Opus playing for 44 s with 12 frames dropped before YouTube's stream protection rejected the session (ump.spsrejectfailure), ten requests to www.youtube.com blocked by the content filter as in any session. The row stays manual: the need, 60 s without a player error, is met in an ordinary session, checked by hand (last on 0.20.3.17), and cannot be met in a session YouTube's server will not attest"
source = ["plan/12-WORK-PLAN-AND-RED-TEAM.md §11"]

