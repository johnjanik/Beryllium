[[feature]]
id = "S-SHM-01"
group = "Shared memory and descriptors"
title = "Anonymous shared memory"
need = "Shared memory is created with memfd_create and seals (SHM_ANON as fallback), never in a named namespace."
priority = "must"
phase = 2
implemented = "done"
built = "no"
tested = "passing"
where = ["patches/security/beryllium-anonymous-shared-memory.patch"]
tests = ["freebsd/tests/browser/tests/test_50_sandbox.py::test_renderer_shared_memory_is_anonymous_and_limited",
         "freebsd/tests/browser/tests/test_50_sandbox.py::test_renderers_hold_no_directories_or_writable_files"]
evidence = "owner, 0.20.3.6, 5 Nov 2026, with and without the lockdown: renderers hold their shared memory as memfd objects (test_renderer_shared_memory_is_anonymous_and_limited passes) and the whole suite passes otherwise; one unnamed writable file per renderer remains, not from PlatformSharedMemoryRegion (S-REN-06); owner, 0.20.3.18, 12 Nov 2026: passes in all seven suite runs of the day; owner, 0.20.3.19 (the code of 0.20.3.18 built again), 12 Nov 2026: passes in both suite runs, one without and one with the lockdown"
source = ["plan/06-SECURITY-MODEL.md §3.3", "plan/03-ARCHITECTURE.md §4.4", "plan/10-RISKS-AND-OPEN-QUESTIONS.md R6"]
notes = "Until 0.20.3.4 every region was an unlinked file in TMPDIR (the Linux memfd path was Linux-only), so renderers held writable files and page content reached a disk file system. From 0.20.3.5: memfd_create, sealed against shrinking and growing, no file fallback. The oracle (mem.memfd_seal, mem.shm_named) shows memfd with seals works in capability mode and named objects do not, on 14.5, 15.1 and 16.0."

[[feature]]
id = "S-SHM-02"
group = "Shared memory and descriptors"
title = "Read-only memory stays read-only"
need = "The browser limits a shared-memory descriptor's rights before passing it, so a renderer cannot map a read-only region writable."
priority = "must"
phase = 2
implemented = "done"
built = "no"
tested = "passing"
where = ["patches/security/beryllium-anonymous-shared-memory.patch"]
tests = ["freebsd/tests/browser/tests/test_50_sandbox.py::test_renderer_shared_memory_is_anonymous_and_limited"]
evidence = "owner, 0.20.3.6, 5 Nov 2026: procstat -C in renderers shows writable regions with read, write, seek, mmap read-write, fstat and fcntl only, read-only twins with read, seek, mmap read-only, fstat and fcntl; no ftruncate or executable mapping anywhere; owner, 0.20.3.18, 12 Nov 2026: passes in all seven suite runs of the day; owner, 0.20.3.19 (the code of 0.20.3.18 built again), 12 Nov 2026: passes in both suite runs, one without and one with the lockdown"
source = ["plan/06-SECURITY-MODEL.md §3.3", "plan/12-WORK-PLAN-AND-RED-TEAM.md §10"]
notes = "The read-only twin is a dup limited to CAP_MMAP_R, CAP_FSTAT and CAP_FCNTL (F_GETFL only); the writable descriptor to CAP_MMAP_RW, CAP_FSTAT and CAP_FCNTL; Chromium's access-mode check reads the rights. The oracle (mem.ro_twin_map_rw, _mprotect, _map_exec, _introspect) shows on 14.5, 15.1 and 16.0 that the twin cannot be mapped writable or executable or upgraded with mprotect. The suite test checks the rights of every shared memory descriptor in renderers."

