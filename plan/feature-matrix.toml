evidence = "owner, 0.20.3.4, 5 Nov 2026: the survey lists about 30 descriptors in a renderer instead of about 120, no directory or profile file, with or without the lockdown (the descriptor test still failed on shared memory, S-SHM-01); owner, 0.20.3.7, 5 Nov 2026: the descriptor test passes with and without the lockdown"
