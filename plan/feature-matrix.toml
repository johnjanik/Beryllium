[[feature]]
id = "P-FPR-07"
group = "Fingerprinting"
title = "Canvas noise on every way out of a canvas"
need = "No route gives a page a canvas's pixels without noise: not WebGL readPixels, not a canvas used as a WebGL texture, not a video frame made from it."
priority = "must"
phase = 1
implemented = "partial"
built = "v0.20.3.18"
tested = "failing"
tests = ["freebsd/privacy/noise-hash/battery.html::copies",
         "freebsd/privacy/noise-hash/battery.html::webglReads", "freebsd/privacy/noise-hash/battery"]
where = ["helium/patches/helium/core/noise/canvas.patch",
         "patches/privacy/beryllium-noise-webgl-readpixels.patch"]
source = ["freebsd/privacy/noise-hash/README.md"]
evidence = "owner, Beryllium 0.20.3.18 (built with patches/privacy/beryllium-noise-webgl-readpixels.patch), FreeBSD 16.0-CURRENT amd64, 12 Nov 2026, the battery, two runs of 30 readbacks with the canvas noise on and a restart between, the same in each: a 2D canvas of known pixels copied into a WebGL texture and read whole with readPixels came back exact in 0 of 60 and with exactly the noise of getImageData in 60 of 60; one-pixel and 3 by 3 reads of a flat colour were exact in 60 of 60; a whole read of four flat squares changed 112 to 123 of 1,024 pixels (the model, run afterwards with 400 tokens: 111 to 123, all on the borders between squares); still exact, as written down before the build: the textured canvas read one pixel at a time (60 of 60) and copied into a VideoFrame (60 of 60); control with the noise off exact in 12 of 12. owner, Beryllium 0.20.3.17, FreeBSD 16.0-CURRENT amd64, 11 Nov 2026, the battery, 30 readbacks with the canvas noise on: a 2D canvas of known pixels copied into a WebGL texture and read with readPixels came back with every pixel exact in 30 of 30, the same through a VideoFrame in 30 of 30, and readPixels of a WebGL canvas was not noised in 30 of 30; exact too with the noise off (6 of 6), so the routes are faithful. owner, Helium 0.21.2.1 as released, macOS arm64 and Fedora x86_64, 11 Nov 2026, 30 readbacks on each with the canvas noise on: a 2D canvas of known pixels copied into a WebGL texture and read with readPixels came back with every pixel exact in 60 of 60, and the same copied into a VideoFrame and copied out; readPixels of a WebGL canvas was not noised in 120 of 120 over two runs; with the noise off the two routes are exact too, so they are faithful"
notes = "Helium's canvas patch calls its noise in four places: getImageData, toDataURL, toBlob and OffscreenCanvas convertToBlob. Beryllium carries that patch unchanged apart from the hash. Not tried: captureStream, createImageBitmap, WebGPU, a WebGL 2 read into a buffer. Read from the source on 11 Nov 2026: neither webgl_rendering_context_base.cc nor webcodecs/video_frame.cc calls the noise; every direct WebGL readPixels goes through one function, ReadPixelsHelper, while VideoFrame copyTo has several paths. Written 11 Nov 2026 and first built in 0.20.3.18, released 12 Nov 2026: patches/privacy/beryllium-noise-webgl-readpixels.patch noises readPixels into an array when the read is RGBA and UNSIGNED_BYTE, anchored to the framebuffer and following the pack parameters, which covers a WebGL scene read back and a canvas read through a texture; a pixel whose whole 3 by 3 neighbourhood in the read is one exact colour is left as read, so that pages that pick objects by colour keep working (Tor Browser's readPixels protection broke such pages). Its new function was compiled outside the tree against Chromium's base headers and agrees with freebsd/privacy/noise-hash/model.py on 240 cases. Left open by it: a read of one pixel at a time, reads in float and integer formats, WebGL 2 reads into a buffer object, video frames, captureStream, createImageBitmap; those need the sinks listed first. Build 0.20.3.18 ran the battery on 12 Nov 2026 and every row came out as rehearsed (evidence); the row stays failing because the need is not met while the video frame and the one-pixel read give exact pixels. The same rows of the battery also show a snapshot noised with red and blue exchanged (P-FPR-04). Priority must, confirmed by the owner on 12 Nov 2026, who also confirmed the flat-colour rule (a pixel whose whole 3 by 3 neighbourhood is one colour is left as read) and so accepts the one-pixel read as open: P-FPR-04's need is not met while this row is open."

